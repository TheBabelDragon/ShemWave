name: Validate

on:
  push:
    branches: [main, feat/yaml-static-renderer, fix/github-pages-browser]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate YAML and assets
        run: python scripts/validate.py
