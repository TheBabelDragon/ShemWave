name: Deploy GitHub Pages

on:
  push:
    branches: [feat/yaml-static-renderer, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify static assets
        run: |
          test -f index.html
          test -f assets/js/app.js
          test -f data/triplets.yaml
          test -f data/presets.yaml
          test -f data/renderer.yaml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
